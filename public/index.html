<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ChiviMarket - Tu Ciudad, Tus Comercios</title>
  <meta name="description" content="Descubrí comercios locales, catálogo de productos, ofertas exclusivas, radar de vidrieras por cercanía y trueques en Chivilcoy.">
  
  <!-- Dynamic Theme Color for Safari iOS 15+ and Chrome -->
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0F172A">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F8FAFC">

  <!-- iOS Meta Tags & Fullscreen Translucent Bar -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ChiviMarket">

  <style>
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      background-color: #0F172A;
      overflow: hidden;
    }
    @media (prefers-color-scheme: light) {
      html, body {
        background-color: #F8FAFC;
      }
    }
  </style>

  <!-- Open Graph / WhatsApp / Facebook / Telegram -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://chivimarket.arumasoft.com/">
  <meta property="og:title" content="ChiviMarket - Tu Ciudad, Tus Comercios">
  <meta property="og:description" content="Descubrí comercios locales, catálogo de productos, ofertas exclusivas, radar de vidrieras por cercanía y trueques en Chivilcoy.">
  <meta property="og:image" content="https://chivimarket.arumasoft.com/icons/Icon-512.png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta property="og:site_name" content="ChiviMarket">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://chivimarket.arumasoft.com/">
  <meta name="twitter:title" content="ChiviMarket - Tu Ciudad, Tus Comercios">
  <meta name="twitter:description" content="Descubrí comercios locales, catálogo de productos, ofertas exclusivas, radar de vidrieras por cercanía y trueques en Chivilcoy.">
  <meta name="twitter:image" content="https://chivimarket.arumasoft.com/icons/Icon-512.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ChiviMarket">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- Titulo ChiviMarket -->
  <link rel="manifest" href="manifest.json">
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function (names) {
        for (let name of names) {
          caches.delete(name);
        }
      });
    }
  </script>
</head>

<body>
  <!--

  <script src="flutter_bootstrap.js?v=28" async></script>
</body>

</html>
